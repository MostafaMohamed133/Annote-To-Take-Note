org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Compile Kotlin inside the Gradle process to avoid Kotlin daemon socket failures
# reported on some Windows/JDK configurations.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.workers.max=2
org.gradle.parallel=false
